<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 550" role="img" aria-label="CSV 문의를 초안과 증빙 화면으로 만든다"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="550" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">CSV 문의를 초안과 증빙 화면으로 만든다</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">실제 데이터 경로·출처와 모델 실행 방식이 결과 화면에 남는다.</text><rect x="40" y="140" width="580" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="40" y="140" width="7" height="125" rx="3" fill="#2457dc"/><text x="62" y="182" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">1. 문의 CSV + 상품 JSON</text><text x="62" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">CSV record_id는 실제 카탈로그 id와 일치</text><rect x="680" y="140" width="580" height="125" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="680" y="140" width="7" height="125" rx="3" fill="#087e8b"/><text x="702" y="182" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">2. 행별 LCEL 실행</text><text x="702" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">정상 답변 / 입력 오류 분리 / 429는 중단</text><rect x="40" y="310" width="580" height="125" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="40" y="310" width="7" height="125" rx="3" fill="#c37a12"/><text x="62" y="352" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">3. 결과 파일 저장</text><text x="62" y="387" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">drafts.jsonl + s08_report.html·json</text><rect x="680" y="310" width="580" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="680" y="310" width="7" height="125" rx="3" fill="#2457dc"/><text x="702" y="352" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">4. 브라우저 화면 캡처</text><text x="702" y="387" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">원문 · 질문 · 결과 · 실행 모드 → evidence/PNG</text><path d="M620,200 L680,200" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M970,265 L970,285 L330,285 L330,310" fill="none" stroke="#2457dc" stroke-width="3" marker-end="url(#blue)"/><path d="M620,370 L680,370" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><text x="45" y="490" font-size="22" fill="#52677e" font-weight="500" text-anchor="start">공개 가공 표본·모의 모델 캡처를 원본 API·실제 모델 증빙으로 바꾸지 않는다.</text><text x="38" y="530" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>