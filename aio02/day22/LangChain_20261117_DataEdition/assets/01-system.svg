<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 550" role="img" aria-label="상품 JSON → 안내 초안 → 결과 화면"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="550" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">상품 JSON → 안내 초안 → 결과 화면</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">데이터를 읽는 Python과 응답을 만드는 모델의 책임을 나눈다.</text><rect x="40" y="140" width="580" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="40" y="140" width="7" height="125" rx="3" fill="#2457dc"/><text x="62" y="182" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">1. 상품 파일 선택</text><text x="62" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">공개 가공 표본 / 직접 API 파일</text><rect x="680" y="140" width="580" height="125" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="680" y="140" width="7" height="125" rx="3" fill="#087e8b"/><text x="702" y="182" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">2. 상품·질문 구성</text><text x="702" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">title · category · description → 메시지</text><rect x="40" y="310" width="580" height="125" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="40" y="310" width="7" height="125" rx="3" fill="#c37a12"/><text x="62" y="352" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">3. 모델·텍스트 파서</text><text x="62" y="387" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">OpenAI 기본 / 모의 모드 · Groq 선택</text><rect x="680" y="310" width="580" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="680" y="310" width="7" height="125" rx="3" fill="#2457dc"/><text x="702" y="352" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">4. 보고서 저장</text><text x="702" y="387" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">원문 + 입력 + 결과 + 실행 모드 → HTML·JSON</text><path d="M620,200 L680,200" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M970,265 L970,285 L330,285 L330,310" fill="none" stroke="#2457dc" stroke-width="3" marker-end="url(#blue)"/><path d="M620,370 L680,370" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><text x="45" y="490" font-size="22" fill="#52677e" font-weight="500" text-anchor="start">1~3차시는 모델을 호출하지 않고 데이터와 메시지를 확인한다.</text><text x="38" y="530" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>