<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 550" role="img" aria-label="LCEL의 순서는 입출력 자료형으로 정한다"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="550" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">LCEL의 순서는 입출력 자료형으로 정한다</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">수동으로 중간 결과를 전달하던 코드를 | 연산자로 연결한다.</text><rect x="40" y="140" width="580" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="40" y="140" width="7" height="125" rx="3" fill="#2457dc"/><text x="62" y="182" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">1. 입력 dict</text><text x="62" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">context: str / question: str</text><rect x="680" y="140" width="580" height="125" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="680" y="140" width="7" height="125" rx="3" fill="#087e8b"/><text x="702" y="182" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">2. ChatPromptTemplate</text><text x="702" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">dict → ChatPromptValue</text><rect x="40" y="310" width="580" height="125" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="40" y="310" width="7" height="125" rx="3" fill="#c37a12"/><text x="62" y="352" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">3. Chat Model</text><text x="62" y="387" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">ChatPromptValue → AIMessage</text><rect x="680" y="310" width="580" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="680" y="310" width="7" height="125" rx="3" fill="#2457dc"/><text x="702" y="352" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">4. StrOutputParser</text><text x="702" y="387" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">AIMessage → 문자열 → HTML 보고서</text><path d="M620,200 L680,200" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M970,265 L970,285 L330,285 L330,310" fill="none" stroke="#2457dc" stroke-width="3" marker-end="url(#blue)"/><path d="M620,370 L680,370" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><text x="45" y="490" font-size="22" fill="#52677e" font-weight="500" text-anchor="start">chain = prompt | model | parser / chain.invoke(values)에서 실행한다.</text><text x="38" y="530" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>